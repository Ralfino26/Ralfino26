name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # 1x per dag
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3.4.1
        with:
          github_user_name: Ralfino26
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#2fa968&color_dots=#eaf2ec,#c5e0c8,#7bc47f,#2fa968,#8bff6b
            dist/github-contribution-grid-snake-dark.svg?color_snake=#8bff6b&color_dots=#0b1a12,#1a3d28,#2fa968,#5fd85a,#8bff6b

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
